apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/hostname: litellm.homelab.kszpakowski.com
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - litellm.homelab.kszpakowski.com
      secretName: litellm-cert
  rules:
    - host: litellm.homelab.kszpakowski.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  name: http
