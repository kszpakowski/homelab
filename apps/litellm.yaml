apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: ghcr.io/berriai/litellm/chart
    chart: litellm
    targetRevision: "1.95.0"
    helm:
      releaseName: litellm
      valuesObject:
        fullnameOverride: litellm-app
        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
            external-dns.alpha.kubernetes.io/hostname: litellm.homelab.kszpakowski.com
          host: litellm.homelab.kszpakowski.com
          tls:
            - hosts:
                - litellm.homelab.kszpakowski.com
              secretName: litellm-cert
        masterKey:
          secretName: litellm-secrets
          secretKey: master-key
        database:
          writer:
            host: litellm-postgres-rw
            dbname: litellm
            passwordSecret:
              name: litellm-postgres-app
              usernameKey: username
              passwordKey: password
        gateway:
          image:
            tag: v1.110.2
          replicaCount: 1
          hpa:
            enabled: false
          keda:
            enabled: false
          envSecrets:
            - litellm-secrets
          extraEnv:
            - name: STORE_MODEL_IN_DB
              value: "True"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
        backend:
          image:
            tag: v1.110.2
          replicaCount: 1
          hpa:
            enabled: false
          envSecrets:
            - litellm-secrets
          extraEnv:
            - name: STORE_MODEL_IN_DB
              value: "True"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
        ui:
          image:
            tag: v1.110.2
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        serviceAccounts:
          gateway:
            automount: false
        migrationJob:
          image:
            tag: v1.110.2
          hooks:
            helm:
              enabled: false
            argocd:
              enabled: true
          backoffLimit: 12
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
