apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: ghcr.io/berriai/litellm/chart
    chart: litellm
    targetRevision: "1.95.0"
    helm:
      releaseName: litellm
      valuesObject:
        fullnameOverride: litellm-app
        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
            external-dns.alpha.kubernetes.io/hostname: litellm.homelab.kszpakowski.com
          host: litellm.homelab.kszpakowski.com
          tls:
            - hosts:
                - litellm.homelab.kszpakowski.com
              secretName: litellm-cert
        masterKey:
          secretName: litellm-secrets
          secretKey: master-key
        database:
          writer:
            host: litellm-postgres-rw
            dbname: litellm
            passwordSecret:
              name: litellm-postgres-app
              usernameKey: username
              passwordKey: password
        redis:
          host: litellm-valkey
          passwordSecret:
            name: litellm-valkey-secret
            passwordKey: password
        gateway:
          image:
            tag: v1.110.2
          config:
            proxy_config:
              general_settings:
                disable_env_credential_login: true
                store_model_in_db: true
                store_prompts_in_spend_logs: true
          replicaCount: 1
          hpa:
            enabled: false
          keda:
            enabled: false
          envSecrets:
            - litellm-secrets
          extraEnv:
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: GENERIC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: client_id
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: client_secret
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: auth_url
            - name: GENERIC_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: token_url
            - name: GENERIC_USERINFO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: api_url
            - name: PROXY_BASE_URL
              value: https://litellm.homelab.kszpakowski.com
            - name: GENERIC_SCOPE
              value: openid profile email
            - name: GENERIC_USER_ID_ATTRIBUTE
              value: sub
            - name: GENERIC_USER_EMAIL_ATTRIBUTE
              value: email
            - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
              value: name
            - name: GENERIC_USER_FIRST_NAME_ATTRIBUTE
              value: given_name
            - name: GENERIC_USER_LAST_NAME_ATTRIBUTE
              value: family_name
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
        backend:
          image:
            tag: v1.110.2
          replicaCount: 1
          hpa:
            enabled: false
          envSecrets:
            - litellm-secrets
          extraEnv:
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: GENERIC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: client_id
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: client_secret
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: auth_url
            - name: GENERIC_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: token_url
            - name: GENERIC_USERINFO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: litellm-oidc
                  key: api_url
            - name: PROXY_BASE_URL
              value: https://litellm.homelab.kszpakowski.com
            - name: GENERIC_SCOPE
              value: openid profile email
            - name: GENERIC_USER_ID_ATTRIBUTE
              value: sub
            - name: GENERIC_USER_EMAIL_ATTRIBUTE
              value: email
            - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
              value: name
            - name: GENERIC_USER_FIRST_NAME_ATTRIBUTE
              value: given_name
            - name: GENERIC_USER_LAST_NAME_ATTRIBUTE
              value: family_name
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
        ui:
          image:
            tag: v1.110.2
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        serviceAccounts:
          gateway:
            automount: false
        migrationJob:
          image:
            tag: v1.110.2
          hooks:
            helm:
              enabled: false
            argocd:
              enabled: true
          backoffLimit: 12
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
