apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/kszpakowski/homelab.git
    targetRevision: HEAD
    path: litellm-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
