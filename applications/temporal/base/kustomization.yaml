apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres-cluster.yaml
  - namespace-job.yaml

helmCharts:
  - name: temporal
    repo: https://go.temporal.io/helm-charts
    version: 1.6.0
    releaseName: temporal
    namespace: temporal
    valuesInline:
      server:
        deploymentAnnotations:
          argocd.argoproj.io/sync-wave: "1"
        config:
          persistence:
            defaultStore: default
            visibilityStore: visibility
            numHistoryShards: 512
            datastores:
              default:
                sql:
                  createDatabase: false
                  manageSchema: true
                  pluginName: postgres12
                  driverName: postgres12
                  databaseName: temporal
                  connectAddr: temporal-postgres-rw:5432
                  connectProtocol: tcp
                  user: temporal
                  existingSecret: temporal-postgres-app
                  secretKey: password
              visibility:
                sql:
                  createDatabase: false
                  manageSchema: true
                  pluginName: postgres12
                  driverName: postgres12
                  databaseName: temporal_visibility
                  connectAddr: temporal-postgres-rw:5432
                  connectProtocol: tcp
                  user: temporal
                  existingSecret: temporal-postgres-app
                  secretKey: password
      admintools:
        deploymentAnnotations:
          argocd.argoproj.io/sync-wave: "2"
      web:
        deploymentAnnotations:
          argocd.argoproj.io/sync-wave: "2"
        ingress:
          enabled: true
          className: traefik
          annotations:
            argocd.argoproj.io/sync-wave: "2"
            cert-manager.io/cluster-issuer: letsencrypt
            external-dns.alpha.kubernetes.io/hostname: temporal.homelab.kszpakowski.com
          hosts:
            - temporal.homelab.kszpakowski.com
          tls:
            - secretName: temporal-web-cert
              hosts:
                - temporal.homelab.kszpakowski.com
      schema:
        useHelmHooks: false
        jobAnnotations:
          argocd.argoproj.io/sync-wave: "0"
      shims:
        dockerize: false
        elasticsearchTool: false
