apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-create-default-namespace-1-31-2
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 100
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-default-namespace
          image: temporalio/admin-tools:1.31.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc:7233
          command:
            - /bin/sh
            - -c
          args:
            - temporal operator namespace describe -n default || temporal operator namespace create -n default --retention 7d
