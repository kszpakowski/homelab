apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: zot
    repo: http://zotregistry.dev/helm-charts
    version: 0.1.124
    releaseName: zot
    namespace: zot
    valuesInline:
      replicaCount: 1
      persistence: true
      pvc:
        create: true
        size: 200Gi
      ingress:
        enabled: true
        className: traefik
        pathtype: Prefix
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts:
          - host: zot.homelab.kszpakowski.com
            paths:
              - path: /
        tls:
          - secretName: zot-cert
            hosts:
              - zot.homelab.kszpakowski.com
