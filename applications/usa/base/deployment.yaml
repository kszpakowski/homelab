apiVersion: apps/v1
kind: Deployment
metadata:
  name: usa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usa
  template:
    metadata:
      labels:
        app: usa
    spec:
      initContainers:
        - name: seed-empty-site
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /site/index.html ]; then
                printf '%s\n' '<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>USA</title></head><body><h1>USA</h1><p>Wgraj docelowy plik HTML jako index.html.</p></body></html>' > /site/index.html
              fi
          volumeMounts:
            - name: site
              mountPath: /site
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: usa-site
