apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: github-actions-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-actions-runner
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 123
      initContainers:
        - name: initialize-state
          image: ghcr.io/actions/actions-runner:2.338.0
          securityContext:
            runAsUser: 0
          command: [bash, -euc]
          args:
            - |
              if [ ! -f /runner/.runner ]; then
                cp -a /home/runner/. /runner/
                chown -R 1001:123 /runner
              fi
          volumeMounts:
            - name: state
              mountPath: /runner
        - name: install-buildctl
          image: moby/buildkit:v0.34.0-rootless
          command: [sh, -ec]
          args: ["cp /usr/bin/buildctl /tools/buildctl"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 123
          volumeMounts:
            - name: tools
              mountPath: /tools
        # Rootless builder; only the pod's loopback interface exposes its API.
        - name: buildkit
          image: moby/buildkit:v0.34.0-rootless
          restartPolicy: Always
          args:
            - --addr=tcp://127.0.0.1:1234
            - --oci-worker-no-process-sandbox
            - --oci-worker-snapshotter=native
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
          startupProbe:
            exec:
              command: [buildctl, --addr=tcp://127.0.0.1:1234, debug, workers]
            periodSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: buildkit-data
              mountPath: /home/user/.local/share/buildkit
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.338.0
          workingDir: /runner
          securityContext:
            runAsUser: 1001
            runAsGroup: 123
          envFrom:
            - configMapRef:
                name: runner-config
          env:
            - name: BUILDKIT_HOST
              value: tcp://127.0.0.1:1234
            - name: BUILDKIT_CLIENT
              value: /tools/buildctl
            - name: RUNNER_TOOL_CACHE
              value: /runner/_tool
          command: [bash, -euc]
          args:
            - |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libssl-dev libsecret-1-dev
              if [ ! -f .runner ]; then
                ./config.sh --unattended --url "https://github.com/$GITHUB_REPOSITORY" \
                  --token "$(cat /registration/token)" --name "$RUNNER_NAME" \
                  --labels homelab,zot --work _work
              fi
              exec ./run.sh
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: state
              mountPath: /runner
            - name: registration
              mountPath: /registration
              readOnly: true
            - name: tools
              mountPath: /tools
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: runner-state
        - name: registration
          secret:
            secretName: runner-registration
        - name: tools
          emptyDir: {}
        - name: buildkit-data
          emptyDir:
            sizeLimit: 40Gi
