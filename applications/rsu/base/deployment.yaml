apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsu
  template:
    metadata:
      labels:
        app: rsu
    spec:
      containers:
        - name: rsu
          image: zot.homelab.kszpakowski.com/rsu-espp-dashboard:latest@sha256:bc48573fae5c9d96065efab09d15042629b80e57c84e4925fc72e7a12d9ed479
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
