apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: directus
          image: directus/directus:12.4.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: directus-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: directus-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: directus-postgres-app
                  key: password
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: directus-runtime-secrets
                  key: SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: directus-bootstrap-admin
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: directus-bootstrap-admin
                  key: ADMIN_PASSWORD
                  optional: true
          ports:
            - name: http
              containerPort: 8055
          startupProbe:
            httpGet:
              path: /server/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /server/health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /server/health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: uploads
              mountPath: /directus/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: directus-uploads

